name: Build and Push Docker Image to Amazon ECR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: prod-web-microservice

jobs:
  build-and-deploy:
    name: Build, Scan & Push Container
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Build & Verify Docker Image Locally
        run: |
          docker build -t ${{ env.ECR_REPOSITORY }}:${{ github.sha }} .
          docker images

      - name: 4. Configure AWS Credentials (Runs on Main Push when Secrets are Set)
        if: github.ref == 'refs/heads/main' && vars.ENABLE_AWS_PUSH == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 5. Login to Amazon ECR
        if: github.ref == 'refs/heads/main' && vars.ENABLE_AWS_PUSH == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 6. Tag & Push Image to Amazon ECR
        if: github.ref == 'refs/heads/main' && vars.ENABLE_AWS_PUSH == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag ${{ env.ECR_REPOSITORY }}:$IMAGE_TAG$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          docker tag ${{ env.ECR_REPOSITORY }}:$IMAGE_TAG $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest
